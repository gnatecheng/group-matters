name: Release APK

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches app version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME=$(grep -m1 'versionName = "' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          EXPECTED="v${VERSION_NAME}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG does not match app/build.gradle.kts versionName ($VERSION_NAME). Expected tag $EXPECTED."
            exit 1
          fi
          echo "Tag $TAG matches versionName $VERSION_NAME"

      - name: Require release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing."
            echo "Create GitHub Actions secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (optional: ANDROID_KEY_PASSWORD)."
            echo "See README — Release signing & GitHub Secrets. Refusing to publish an unsigned or debug APK."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKM="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "sdkmanager=${SDKM}"
          yes | "${SDKM}" --licenses >/dev/null || true
          "${SDKM}" "platforms;android-36" "build-tools;35.0.0"

      - name: Install release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"

      - name: Read versionName and versionCode
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName = "' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed 's/.*versionCode = //')
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

      - name: Require non-empty Fastlane release notes
        if: github.event_name == 'push'
        run: |
          VERSION_CODE="${{ steps.version.outputs.code }}"
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ ! -s "$CHANGELOG" ]; then
            echo "::error::Missing or empty release notes: $CHANGELOG"
            exit 1
          fi
          echo "Release notes OK ($CHANGELOG)"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Prepare release assets
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          APK_NAME="group-matters-${VERSION_NAME}.apk"
          AAB_NAME="group-matters-${VERSION_NAME}.aab"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          cp app/build/outputs/bundle/release/app-release.aab "${AAB_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "AAB_NAME=${AAB_NAME}" >> "$GITHUB_ENV"
          ls -la "${APK_NAME}" "${AAB_NAME}"

      - name: Write release notes
        run: |
          VERSION_CODE="${{ steps.version.outputs.code }}"
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          {
            echo "## 团团记 / Group Matters ${{ steps.version.outputs.name }}"
            echo
            cat "$CHANGELOG"
            echo
            echo "Signed release APK (\`assembleRelease\`) and matching AAB (\`bundleRelease\`), applicationId \`com.classrecord.app\`. Same release keystore as GitHub APK so updates are compatible across install channels."
            echo
            echo "Tag: ${GITHUB_REF_NAME}"
          } > release_body.md

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: 团团记 / Group Matters ${{ steps.version.outputs.name }}
          body_path: release_body.md
          files: ${{ env.APK_NAME }}
          fail_on_unmatched_files: true

      - name: Upload signed APK to Cloudflare R2
        if: github.event_name == 'push'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2 upload skipped: configure repository secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and R2_ACCOUNT_ID to publish the release APK to bucket etai-apk."
            exit 0
          fi
          aws s3 cp "${APK_NAME}" "s3://etai-apk/${APK_NAME}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/vnd.android.package-archive
          echo "Uploaded s3://etai-apk/${APK_NAME}"

      - name: Upload version manifest to Cloudflare R2
        if: github.event_name == 'push'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "Version manifest upload skipped (R2 secrets not configured)."
            exit 0
          fi
          VERSION_NAME="${{ steps.version.outputs.name }}"
          VERSION_CODE="${{ steps.version.outputs.code }}"
          MANIFEST="group-matters-version.json"
          CHANGELOG_EN="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          CHANGELOG_ZH="fastlane/metadata/android/zh-CN/changelogs/${VERSION_CODE}.txt"
          NOTES_EN=""
          NOTES_ZH=""
          if [ -s "$CHANGELOG_EN" ]; then
            NOTES_EN=$(cat "$CHANGELOG_EN")
          fi
          if [ -s "$CHANGELOG_ZH" ]; then
            NOTES_ZH=$(cat "$CHANGELOG_ZH")
          fi
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://dl.etais.dev/group-matters-${VERSION_NAME}.apk" \
            --arg notesEn "$NOTES_EN" \
            --arg notesZh "$NOTES_ZH" \
            '{
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: $apkUrl,
              releaseNotes: (if ($notesEn | length) > 0 or ($notesZh | length) > 0 then {en: $notesEn, zh: $notesZh} else null end)
            }' > "$MANIFEST"
          if [ ! -s "$MANIFEST" ]; then
            echo "Version manifest missing or empty; skipping upload."
            exit 0
          fi
          aws s3 cp "$MANIFEST" "s3://etai-apk/${MANIFEST}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json
          echo "Uploaded s3://etai-apk/${MANIFEST}"

      - name: Verify CDN APK matches local release
        if: github.event_name == 'push'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "CDN checksum verification skipped (R2 secrets not configured)."
            exit 0
          fi
          LOCAL=$(sha256sum "${APK_NAME}" | awk '{print $1}')
          REMOTE=$(curl -fsSL "https://dl.etais.dev/${APK_NAME}" | sha256sum | awk '{print $1}')
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::CDN APK checksum mismatch for ${APK_NAME}"
            echo "local=${LOCAL}"
            echo "cdn=${REMOTE}"
            exit 1
          fi
          echo "CDN checksum OK: ${LOCAL}"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: group-matters-release-aab
          path: ${{ env.AAB_NAME }}
          if-no-files-found: error

      - name: Manual run note
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "workflow_dispatch verifies signed APK/AAB builds and uploads the AAB as a workflow artifact. Push semver tag vX.Y.Z (matching versionName) to publish the APK on GitHub Releases."
